# Knowledge Assistant: Spring Boot + PostgreSQL with pgvector
# Run:  docker compose up --build
# Ollama runs on the host (not in Docker) to save memory.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"          # 5433 on the host, so it does not clash with other local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs only on the first start (empty volume)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kb}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_DATABASE: ${POSTGRES_DB:-kb}
      PGVECTOR_USER: ${POSTGRES_USER:-kb}
      PGVECTOR_PASSWORD: ${POSTGRES_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    mem_limit: 768m

volumes:
  pgdata:
